name: CI

# Any PR (so stacked phase PRs are checked too) and every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id must stay "build": the protect-main ruleset requires a check with that name.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shelter
          POSTGRES_PASSWORD: shelter
          POSTGRES_DB: shelter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_IGNORE_DOTENV: "1"
      DATABASE_URL: postgres://shelter:shelter@localhost:5432/shelter
      SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Django checks
        run: python manage.py check

      - name: Migrations match models
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
