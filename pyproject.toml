[project]
name = "shelter-calendar"
version = "0.5.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
# Test names say what they check; a docstring would only repeat the name.
"tests/**" = ["D103"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
# WhiteNoise warns that collectstatic has not run; tests serve static files from the apps.
filterwarnings = ["ignore:No directory at:UserWarning"]
