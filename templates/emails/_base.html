<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0; padding:0; background:#F7F4EE;">
  <div style="max-width:560px; margin:0 auto; padding:24px 16px; font-family:Arial, Helvetica, sans-serif; font-size:19px; line-height:1.6; color:#1E2A32;">
    {% block body %}{% endblock %}
    <p style="margin:32px 0 0; font-size:17px; color:#52606D;">
      {% if shelter.phone %}Questions? Call the shelter at <a href="tel:{{ shelter.phone_link }}" style="color:#1E2A32;">{{ shelter.phone }}</a>.<br>{% endif %}
      The volunteer team at {{ shelter.name }}
    </p>
  </div>
</body>
</html>
