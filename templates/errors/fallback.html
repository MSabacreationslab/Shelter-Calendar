<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ error.title }}</title>
</head>
<body style="font-family: sans-serif; font-size: 1.125rem; line-height: 1.6; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1E2A32; background: #F7F4EE;">
  <h1>{{ error.title }}</h1>
  <p>{{ error.message }}</p>
  <p><a href="/">Go to the home page</a></p>
  {% if admin_told %}<p>We've let the admin know automatically, so you don't need to report it.</p>{% endif %}
  <p>Reference: {{ ref }}</p>
</body>
</html>
